server:
  port: 8443
  servlet:
    context-path: /api
  ssl:
    enabled: true
    key-store: classpath:uibpulse-ssl.p12
    key-store-password: uibpulse2024
    key-store-type: PKCS12
    key-alias: uibpulse

spring:
  application:
    name: uib-pulse

  datasource:
    url: jdbc:mysql://localhost:3306/uib_pulse?useSSL=false&serverTimezone=UTC&allowPublicKeyRetrieval=true&createDatabaseIfNotExist=true
    username: root
    password: ""
    driver-class-name: com.mysql.cj.jdbc.Driver

  jpa:
    hibernate:
      ddl-auto: update
    show-sql: false
    properties:
      hibernate:
        dialect: org.hibernate.dialect.MySQLDialect
        format_sql: true

  mail:
    host: sandbox.smtp.mailtrap.io
    port: 2525
    username: "your_mailtrap_username"
    password: "your_mailtrap_password"
    properties:
      mail:
        smtp:
          auth: true
          starttls:
            enable: true

app:
  google:
    client-id: "493510963157-5s973qircr42g6ress6hea56e7hfhf4f.apps.googleusercontent.com"
  jwt:
    secret: UIBPulse2024SuperSecretKeyForJWTSigningMustBe256BitsLongAtMinimum!
    expiration-ms: 86400000  # 24 hours

  # AES-256 key — must be exactly 32 characters (256 bits)
  encryption:
    key: "UIBPulse@AES256Key#2024!SecureDB"

  cors:
    allowed-origins: "https://localhost:5173,https://localhost:5174,https://localhost:3000"

logging:
  level:
    com.uib.pulse: DEBUG
    org.springframework.security: INFO
